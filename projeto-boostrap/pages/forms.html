<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href = "../css/bootstrap.min.css" rel = "stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body class = "container py-5">
    <h2> Formulário de Exemplo</h2>
    <form>
        <div class = "mb-3">
            <label class = "form-label">Email</label>
            <input type = "email" class = "form-control" placeholder = "Digite seu email" required>
            <div class = "form-text">Este campo é obrigatório.</div>
            <div class = "invalid-feedback">Por favor, preencha este campo.</div>
            <div class = "valid-feedback">Campo preenchido com sucesso!</div>
        </div>
        
        <div class = "mb-3">
            <label class = "form-label">Senha</label>
            <input type = "password" class = "form-control" placeholder = "Digite sua senha" required>
            <div class = "form-text">Este campo é obrigatório.</div>
            <div class = "invalid-feedback">Por favor, preencha este campo.</div>
            <div class = "valid-feedback">Campo preenchido com sucesso!</div>
        </div>

        <button class = "btn btn-primary" type = "submit">Enviar</button>

    </form>

</body>

</html>
